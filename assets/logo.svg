<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="胆子肥嘟嘟大学">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="0.55" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3526"/>
      <stop offset="1" stop-color="#2E2018"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#E8A400" stroke-width="2" opacity=".55"/>

  <!-- ears -->
  <ellipse cx="39" cy="27" rx="9.5" ry="15" fill="url(#fur)" transform="rotate(-20 39 27)"/>
  <ellipse cx="81" cy="27" rx="9.5" ry="15" fill="url(#fur)" transform="rotate(20 81 27)"/>
  <ellipse cx="39" cy="28" rx="4.5" ry="8" fill="#FFB27A" transform="rotate(-20 39 28)"/>
  <ellipse cx="81" cy="28" rx="4.5" ry="8" fill="#FFB27A" transform="rotate(20 81 28)"/>

  <!-- head -->
  <circle cx="60" cy="55" r="27" fill="url(#fur)"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="65" rx="17.5" ry="13.5" fill="#FFF4E4"/>
  <!-- eyes -->
  <circle cx="49" cy="49" r="5" fill="#FFF4E4"/>
  <circle cx="71" cy="49" r="5" fill="#FFF4E4"/>
  <circle cx="50.4" cy="49.8" r="2.3" fill="#1A1208"/>
  <circle cx="69.6" cy="49.8" r="2.3" fill="#1A1208"/>
  <!-- bold brows: 胆子肥 -->
  <rect x="42" y="38.5" width="15" height="4" rx="2" fill="#FFF4E4" transform="rotate(-14 49.5 40.5)"/>
  <rect x="63" y="38.5" width="15" height="4" rx="2" fill="#FFF4E4" transform="rotate(14 70.5 40.5)"/>
  <!-- nose & smile -->
  <ellipse cx="60" cy="60.5" rx="4.2" ry="3" fill="#3B2A1E"/>
  <path d="M52.5 68.5 Q60 75 67.5 68.5" stroke="#3B2A1E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- chubby cheeks -->
  <circle cx="34" cy="63" r="4.6" fill="#FF9E6B" opacity=".9"/>
  <circle cx="86" cy="63" r="4.6" fill="#FF9E6B" opacity=".9"/>

  <!-- body / pouch -->
  <path d="M33 86 Q34 76 60 76 Q86 76 87 86 Q87 107 60 107 Q33 107 33 86 Z" fill="url(#fur)"/>
  <!-- bowl in pouch -->
  <ellipse cx="60" cy="89.5" rx="16.5" ry="5" fill="#FFF4E4"/>
  <path d="M47 90.5 Q60 103 73 90.5 Z" fill="#E8541F"/>
  <ellipse cx="60" cy="90.5" rx="13" ry="3.4" fill="#FFFFFF"/>
  <!-- rice -->
  <path d="M52 89 Q60 82 68 89 Z" fill="#FFFFFF"/>
  <!-- chopsticks -->
  <rect x="61" y="78" width="2.2" height="18" rx="1.1" fill="#D9A15B" transform="rotate(18 62 87)"/>
  <rect x="66" y="78" width="2.2" height="18" rx="1.1" fill="#D9A15B" transform="rotate(24 67 87)"/>
</svg>